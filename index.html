<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
  <header>
    <h1>2º Ano DS — Barbosa Ferraz</h1>
  </header>

  <!-- Seção do professor: sozinho, centralizado, em destaque -->
  <section class="secao-professor">
    <div class="card-fifa card-mateus">
      <div class="card-topo">
        <span class="card-rating">99</span>
        <span class="card-posicao">PROF</span>
      </div>
      <img src="img/mateus.png" alt="Foto do professor" class="card-foto">
      <h2 class="card-nome">MATEUS BARBOSA</h2>
      <p class="card-subtitulo">Desenvolvimento Web</p>
      <div class="card-stats">
        <div class="stat"><span>HTML</span><span>95</span></div>
        <div class="stat"><span>CSS</span><span>92</span></div>
        <div class="stat"><span>JS</span><span>90</span></div>
        <div class="stat"><span>GIT</span><span>88</span></div>
      </div>
    </div>
  </section>

  
  <main class="galeria-alunos">
 <section class="secao-professor">
    <div class="card-fifa card-mateus">
      <div class="card-topo">
        <span class="card-rating">85</span>
        <span class="card-posicao">ALUNO</span>
      </div>
      <img src="img/gabriel.jpeg" alt="Foto do professor" class="card-foto">
      <h2 class="card-nome">GABRIEL OLIVEIRA ROCHA</h2>
      <p class="card-subtitulo">Desenvolvimento Web</p>
      <div class="card-stats">
        <div class="stat"><span>HTML</span><span>78</span></div>
        <div class="stat"><span>CSS</span><span>80</span></div>
        <div class="stat"><span>JS</span><span>0,001</span></div>
        <div class="stat"><span>GIT</span><span>60</span></div>
      </div>
    </div>
  </section>

    <section class="secao-aluno">

      <div class="card-topo">
        <span class="card-rating">&infin;</span>
        <span class="card-posicao">Cordeiro</span>
      </div>
      <img src="img/donaldtrump00.png" alt="messisentado class="card-foto">
      <h2 class="card-nome">GABRIEL CORDEIRO</h2>
      <p class="card-subtitulo">Desenvolvimento Web</p>
      <div class="card-stats">
        <div class="stat"><span>HTML</span><span>00</span></div>
        <div class="stat"><span>CSS</span><span>-80</span></div>
        <div class="stat"><span>JS</span><span>03</span></div>
        <div class="stat"><span>GIT</span><span>100</span></div>

  </main>
</body>
</html>
